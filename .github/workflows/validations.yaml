name: "Validations"
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  Static-Analysis:
    # Note: changing this job name requires making the same update in the .github/workflows/release.yaml pipeline
    name: "Static analysis"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # setup checkout, go, go-make, binny, and cache go modules
      - uses: anchore/go-make/.github/actions/setup@d418f02b4fe642017bc0c6308525f3eacea24311 # v0.9.7-0.20261113101004-d418f02b4fe6

      - name: Run static analysis
        run: make static-analysis

  Unit-Test:
    # Note: changing this job name requires making the same update in the .github/workflows/release.yaml pipeline
    name: "Unit tests"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # setup checkout, go, go-make, binny, and cache go modules
      - uses: anchore/go-make/.github/actions/setup@d418f02b4fe642017bc0c6308525f3eacea24311 # v0.9.7-0.20261113101004-d418f02b4fe6

      - name: Run unit tests
        run: make unit
